
name: Build OpenCat

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2). Leave empty for build only."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build OpenCat Linux x86_64 (Debian 13 / FFmpeg 7)
    runs-on: ubuntu-24.04

    container:
      image: debian:trixie

    steps:
      - name: Install System Dependencies
        run: |
          apt-get update

          apt-get install -y \
            git \
            curl \
            ca-certificates \
            build-essential \
            pkg-config \
            clang \
            cmake \
            nasm \
            yasm \
            zip \
            file \
            binutils \
            python3 \
            libasound2-dev \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libgl1-mesa-dev \
            libegl-dev \
            libgles-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxrender-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            libfreetype-dev

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust
        run: |
          rustc --version
          cargo --version

      - name: Check FFmpeg 7
        run: |
          ffmpeg -version

          echo "FFmpeg library versions:"

          pkg-config --modversion libavcodec
          pkg-config --modversion libavdevice
          pkg-config --modversion libavfilter
          pkg-config --modversion libavformat
          pkg-config --modversion libavutil
          pkg-config --modversion libswresample
          pkg-config --modversion libswscale

          CODEC_VERSION=$(pkg-config --modversion libavcodec)

          if [ "${CODEC_VERSION%%.*}" != "61" ]; then
            echo "ERROR: FFmpeg 7 required, found libavcodec $CODEC_VERSION"
            exit 1
          fi

      - name: Fetch Prebuilt Dependencies
        run: |
          if [ -f docker/fetch-prebuilt.sh ]; then
            sh docker/fetch-prebuilt.sh
          else
            echo "ERROR: docker/fetch-prebuilt.sh not found"
            exit 1
          fi

      - name: Build OpenCat
        run: |
          cargo build --release --locked -p opencat

      - name: Verify Binary
        run: |
          ls -lh target/release/opencat
          file target/release/opencat

          echo "Checking shared libraries..."
          ldd target/release/opencat

          if ldd target/release/opencat | grep -q "not found"; then
            echo "ERROR: Missing shared libraries"
            exit 1
          fi

      - name: Package Binary
        run: |
          mkdir -p release

          cp target/release/opencat release/opencat

          cd release
          zip -9 opencat-linux-x86_64.zip opencat

          ls -lh opencat-linux-x86_64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencat-linux-x86_64
          path: release/opencat-linux-x86_64.zip
          retention-days: 30

      - name: Create Release Notes
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"

          cat > RELEASE_NOTES.md <<EOF
          ## OpenCat Linux x86_64

          Built on Debian 13 (Trixie) with FFmpeg 7.

          ### Download & Install

          \`\`\`bash
          curl -fL -o opencat-linux-x86_64.zip https://github.com/boytegar/opencat/releases/download/${TAG}/opencat-linux-x86_64.zip

          python3 -m zipfile -e opencat-linux-x86_64.zip .

          sudo install -m 755 opencat /usr/local/bin/opencat
          \`\`\`

          ### Verify

          \`\`\`bash
          opencat --version
          \`\`\`

          ### Requirements

          - Debian 13 (Trixie)
          - FFmpeg 7 runtime libraries
          - EGL / OpenGL libraries

          EOF

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: OpenCat ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release/opencat-linux-x86_64.zip
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
